<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ورود مدیر</title>
    <style>
      body {
        font-family: system-ui, Tahoma, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0f1419;
        color: #e8ecf1;
      }
      form {
        display: grid;
        gap: 12px;
        width: min(340px, 90vw);
        padding: 24px;
        background: #1a212b;
        border-radius: 12px;
      }
      input,
      button {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #334;
        background: #0f1419;
        color: inherit;
        font: inherit;
      }
      button {
        background: #3b82f6;
        border: 0;
        cursor: pointer;
      }
      #err {
        color: #f87171;
        min-height: 1.2em;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <form id="f">
      <h1 style="margin: 0; font-size: 20px">ورود مدیر</h1>
      <input
        name="username"
        placeholder="نام کاربری"
        autocomplete="username"
        required
      />
      <input
        name="password"
        type="password"
        placeholder="رمز عبور"
        autocomplete="current-password"
        required
      />
      <p id="err"></p>
      <button>ورود</button>
    </form>
    <script>
      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const r = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
        });
        if (r.ok) location.href = "/admin/";
        else
          document.getElementById("err").textContent =
            (await r.json().catch(() => ({}))).error || "خطا";
      });
    </script>
  </body>
</html>
