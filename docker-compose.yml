services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crisis_council}
      POSTGRES_USER: ${POSTGRES_USER:-crisis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crisis_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      ADMIN_KEY: ${ADMIN_KEY:-change-me}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-crisis}
      PGPASSWORD: ${POSTGRES_PASSWORD:-crisis_dev_password}
      PGDATABASE: ${POSTGRES_DB:-crisis_council}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
